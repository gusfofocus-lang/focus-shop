<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บของกู</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 2rem;
            text-align: center;
            border-bottom: 2px solid #0f3460;
        }
        h1 { font-size: 2.5rem; color: #e94560; }
        nav { margin: 1rem 0; }
        nav a {
            color: #e0e0e0;
            margin: 0 1rem;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover { color: #e94560; }
        main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .card {
            background: #16213e;
            padding: 1.5rem;
            margin: 1rem 0;
            border-radius: 8px;
            border-left: 4px solid #e94560;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { background: #c73e54; }
        footer {
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
            background: #0f3460;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>เว็บของกู</h1>
        <nav>
            <a href="#home">หน้าแรก</a>
            <a href="#about">เกี่ยวกับ</a>
            <a href="#contact">ติดต่อ</a>
        </nav>
    </header>
    <main>
        <section id="home" class="card">
            <h2>ยินดีต้อนรับ</h2>
            <p>นี่คือเว็บไซต์ตัวอย่างที่กูทำให้มึง ใช้ได้เลย แก้ได้ตามใจ</p>
            <button onclick="alert('กดแล้ว จัดไป!')">กดปุ่มนี้</button>
        </section>
        <section id="about" class="card">
            <h2>เกี่ยวกับ</h2>
            <p>เว็บนี้สร้างด้วย HTML, CSS, JS ล้วนๆ ไม่มีเฟรมเวิร์ก เบาๆ เร็วๆ</p>
        </section>
        <section id="contact" class="card">
            <h2>ติดต่อ</h2>
            <p>ส่งข้อความมาได้เลย</p>
            <form onsubmit="event.preventDefault(); alert('ส่งแล้ว!');">
                <input type="text" placeholder="ชื่อ" style="padding:0.5rem; margin:0.5rem 0; width:100%; background:#0a0a0a; color:white; border:1px solid #e94560;">
                <input type="email" placeholder="อีเมล" style="padding:0.5rem; margin:0.5rem 0; width:100%; background:#0a0a0a; color:white; border:1px solid #e94560;">
                <textarea placeholder="ข้อความ" style="padding:0.5rem; margin:0.5rem 0; width:100%; height:100px; background:#0a0a0a; color:white; border:1px solid #e94560;"></textarea>
                <button type="submit">ส่ง</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 เว็บของกู — จัดให้เฮีย</p>
    </footer>
    <script>
        console.log('เว็บพร้อมแล้ว');
        document.querySelectorAll('a').forEach(a => {
            a.addEventListener('click', e => {
                e.preventDefault();
                const target = document.querySelector(a.getAttribute('href'));
                if (target) target.scrollIntoView({ behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
